name: daily-screen
on:
  schedule:
    # 毎営業日 19:17 JST (10:17 UTC)。GitHubの定時実行は毎時0分・30分が混雑して数時間遅れるため、半端な分にずらす。Yahooの東証日足は大引け後1〜2時間で反映される。
    # 最初の数日は screen.md の as-of 日付が当日になっているか確認し、遅れていれば時刻を後ろにずらす
    - cron: "17 10 * * 1-5"
    # 予備: 21:43 JST。1回目が失敗・取りこぼした日の再実行
    - cron: "43 12 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["watchlist.txt"]     # watchlist を編集したら即分析
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: restore data cache
        uses: actions/cache@v6
        with:
          path: data
          key: yf-data-${{ github.run_id }}
          restore-keys: yf-data-
      - name: guard (場中なら何もしない。定時実行が翌日の場中まで遅れることがある)
        id: guard
        run: |
          H=$(TZ=Asia/Tokyo date +%H); D=$(TZ=Asia/Tokyo date +%u)
          if [ "$D" -le 5 ] && [ "$H" -ge 8 ] && [ "$H" -lt 16 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "場中 (JST $(TZ=Asia/Tokyo date +%H:%M)) のため実行しない"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: screen
        if: ${{ github.event_name != 'push' && steps.guard.outputs.skip != 'true' }}
        run: python -m src.screen
      - name: universe (全銘柄スナップショットと基本スクリーニング)
        if: ${{ github.event_name != 'push' && steps.guard.outputs.skip != 'true' }}
        run: python -m src.universe --offline
      - name: events (急落銘柄の候補リスト)
        if: ${{ github.event_name != 'push' && steps.guard.outputs.skip != 'true' }}
        run: python -m src.events --offline
      - name: ichimoku (雲上抜け候補)
        if: ${{ github.event_name != 'push' && steps.guard.outputs.skip != 'true' }}
        run: python -m src.ichimoku --offline
      - name: paper (仮想取引の約定・決済)
        if: ${{ github.event_name != 'push' && steps.guard.outputs.skip != 'true' }}
        run: python -m src.paper settle
      - name: watchlist
        run: python -m src.watch
      - name: commit outputs
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs paper
          git commit -m "outputs $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
