name: daily-screen
on:
  schedule:
    # 毎営業日 19:17 JST (10:17 UTC)。GitHubの定時実行は毎時0分・30分が混雑して数時間遅れるため、半端な分にずらす。Yahooの東証日足は大引け後1〜2時間で反映される。
    # 最初の数日は screen.md の as-of 日付が当日になっているか確認し、遅れていれば時刻を後ろにずらす
    - cron: "17 10 * * 1-5"
    # 予備: 21:43 JST。1回目が失敗・取りこぼした日の再実行
    - cron: "43 12 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["watchlist.txt", ".github/workflows/daily.yml"]     # 一時変更: 修正の検証用。完了後に watchlist.txt のみへ戻す
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: restore data cache
        uses: actions/cache@v6
        with:
          path: data
          key: yf-data-${{ github.run_id }}
          restore-keys: yf-data-
      - name: screen
        if: true  # 一時変更: 検証用。完了後に github.event_name != 'push' へ戻す
        run: python -m src.screen
      - name: universe (全銘柄スナップショットと基本スクリーニング)
        if: true  # 一時変更: 検証用。完了後に github.event_name != 'push' へ戻す
        run: python -m src.universe --offline
      - name: events (急落銘柄の候補リスト)
        if: true  # 一時変更: 検証用。完了後に github.event_name != 'push' へ戻す
        run: python -m src.events --offline
      - name: paper (仮想取引の約定・決済)
        if: true  # 一時変更: 検証用。完了後に github.event_name != 'push' へ戻す
        run: python -m src.paper settle
      - name: watchlist
        run: python -m src.watch
      - name: commit outputs
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs paper
          git commit -m "outputs $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
